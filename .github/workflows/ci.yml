name: SDK checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release contents and reachable history
        if: github.repository == 'YaolinDong/infrabot-sdk'
        run: tools/prepublish_check.sh --history
      - name: Check release allowlist in development checkouts
        if: github.repository != 'YaolinDong/infrabot-sdk'
        run: tools/prepublish_check.sh --manifest-only

  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: YaolinDong/infrabot-description
          path: model-source
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev qtbase5-dev libqt5opengl5-dev python3-numpy
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DINFRABOT_BUILD_TESTS=ON \
            -DINFRABOT_BUILD_EXAMPLES=ON -DINFRABOT_BUILD_GUI=ON -DPython3_EXECUTABLE=/usr/bin/python3 \
            -DINFRABOT_DESCRIPTION_DIR="$PWD/model-source"
          cmake --build build --parallel 4
      - name: Run loopback and offscreen tests
        run: |
          test -x build/udp_control_gui
          ctest --test-dir build --output-on-failure
      - name: Install CMake package
        run: cmake --install build --prefix "$RUNNER_TEMP/sdk"

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev
      - name: Install SDK from source
        run: |
          python -m pip install "pybind11>=3"
          python -m pip install .
      - name: Build only the loopback board for this interpreter
        run: |
          cmake -S . -B build-fixture -DCMAKE_BUILD_TYPE=Debug -DINFRABOT_BUILD_GUI=OFF \
            -DINFRABOT_BUILD_PYTHON=ON -DINFRABOT_BUILD_TESTS=ON \
            -DPython3_EXECUTABLE="$(command -v python)" -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          cmake --build build-fixture --target _infrabot_test_mcu --parallel 2
      - name: Test the installed SDK and supplied examples
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/build-fixture"
          cd "$RUNNER_TEMP"
          python -c 'import infrabot, infrabot_native; assert infrabot.Robot is infrabot_native.Robot'
          python -B "$GITHUB_WORKSPACE/tests/test_robot_binding.py"
          python -B "$GITHUB_WORKSPACE/tests/test_examples.py"

  shared-protocol:
    runs-on: ubuntu-latest
    if: github.repository == 'YaolinDong/infrabot-sdk'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: YaolinDong/infrabot-firmware
          path: firmware-source
      - name: Compare protocol and exercise firmware FK
        run: |
          export INFRABOT_FIRMWARE_DIR="$PWD/firmware-source"
          python3 tests/test_shared_protocol.py
          sudo apt-get update && sudo apt-get install -y python3-numpy
          /usr/bin/python3 -B tests/test_analyze_return.py
