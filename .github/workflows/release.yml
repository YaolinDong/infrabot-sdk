# Release packages: built for every tag, and attached to that tag's GitHub
# Release together with SHA256SUMS. Running the workflow by hand publishes the
# tag of the version in CMakeLists.txt (or the tag given), without moving it.
name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (defaults to v<project VERSION>)
        required: false
permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: 1700000000

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version=$(sed -nE 's/^project\(infrabot_sdk VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          tag="${{ inputs.tag }}"
          [ -n "${tag}" ] || tag="v${version}"
          if [ "${tag}" != "v${version}" ]; then
            echo "tag ${tag} does not match project(VERSION ${version})" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  tarball:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ libssl-dev
      - name: Build the SDK tarball
        run: |
          cmake -S . -B build-package -DCMAKE_BUILD_TYPE=Release \
            -DINFRABOT_BUILD_GUI=OFF -DINFRABOT_BUILD_PYTHON=OFF
          cmake --build build-package --parallel 2
          cd build-package
          cpack -G TGZ -B "$GITHUB_WORKSPACE/dist" \
            -D CPACK_PACKAGE_FILE_NAME=infrabot-sdk-${{ needs.version.outputs.version }}-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: dist/*
          retention-days: 7

  deb:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            codename: jammy
          - runner: ubuntu-24.04
            codename: noble
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ libssl-dev
      - name: Build the Debian package
        run: |
          cmake -S . -B build-package -DCMAKE_BUILD_TYPE=Release \
            -DINFRABOT_BUILD_GUI=OFF -DINFRABOT_BUILD_PYTHON=OFF
          cmake --build build-package --parallel 2
          cd build-package
          cpack -G DEB -B "$GITHUB_WORKSPACE/dist" -D CPACK_PACKAGING_INSTALL_PREFIX=/usr
          cd "$GITHUB_WORKSPACE/dist"
          # One package per Ubuntu release, as libfranka does.
          for f in infrabot-sdk_*_amd64.deb; do
            mv "$f" "${f%.deb}-${{ matrix.codename }}.deb"
          done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.codename }}
          path: dist/*
          retention-days: 7

  wheels:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64
          CIBW_ARCHS_LINUX: x86_64
          # Ubuntu 22.04 (glibc 2.35) and newer; the image carries OpenSSL 3.
          CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_34_x86_64
          CIBW_BEFORE_ALL_LINUX: dnf install -y openssl-devel
          CIBW_TEST_REQUIRES: ""
          CIBW_TEST_COMMAND: python -c "import infrabot; assert infrabot.Robot"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/*.whl
          retention-days: 7

  sdist:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet build
      - run: python3 -m build --sdist --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*
          retention-days: 7

  pypi:
    # Trusted publishing: PyPI must hold a publisher for this repository, this
    # workflow and the environment pypi; the repository variable PYPI_PUBLISH
    # turns the upload on. See CONTRIBUTING.md, Releasing.
    needs: [version, wheels, sdist]
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  publish:
    needs: [version, tarball, deb, wheels, sdist]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add the checksums
        run: |
          cd dist
          ls -l
          sha256sum infrabot-sdk-* infrabot-sdk_* infrabot_sdk-* > SHA256SUMS
          cat SHA256SUMS
      - name: Write the release notes
        run: |
          version="${{ needs.version.outputs.version }}"
          tag="${{ needs.version.outputs.tag }}"
          awk -v start="## ${version}" '$0 ~ "^## " && seen {exit} $0 ~ "^" start {seen=1} seen' \
            CHANGELOG.md > notes.md
          {
            echo
            echo "## Packages"
            echo
            echo "- \`infrabot-sdk-${version}-linux-x86_64.tar.gz\`: headers, \`libinfrabot_sdk.a\` and"
            echo "  the CMake package files, for \`find_package(infrabot_sdk)\`."
            echo "- \`infrabot-sdk_${version}_jammy_amd64.deb\`, \`infrabot-sdk_${version}_noble_amd64.deb\`:"
            echo "  the same under \`/usr\`, for Ubuntu 22.04 and 24.04."
            echo "- \`infrabot_sdk-${version}-cp3{10,11,12,13}-*.whl\`: the Python binding for Python"
            echo "  3.10 to 3.13, manylinux, glibc 2.34 or newer. Also on PyPI:"
            echo "  \`pip install infrabot-sdk==${version}\`."
            echo "- \`infrabot_sdk-${version}.tar.gz\`: the source package, for any other platform"
            echo "  (\`pip install\` builds it with CMake disabled, straight from \`setup.py\`)."
            echo "- \`SHA256SUMS\`: \`sha256sum -c SHA256SUMS\` checks the downloads."
            echo
            echo "The API reference for this version: https://yaolindong.github.io/infrabot-sdk/en/${version}/cpp/"
          } >> notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "infrabot-sdk ${VERSION}" --notes-file notes.md
          else
            gh release create "$TAG" --title "infrabot-sdk ${VERSION}" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
