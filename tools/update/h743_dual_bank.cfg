# stm32h7x.cfg defaults to registering Bank 1 only, even on a dual-bank H743.
# Register and check both address ranges before the install script runs.
set DUAL_BANK 1
source [find target/stm32h7x.cfg]
set h743_banks [flash list]
if {[llength $h743_banks] != 2 ||
    [dict get [lindex $h743_banks 0] base] != 0x08000000 ||
    [dict get [lindex $h743_banks 1] base] != 0x08100000} {
    error "Expected H743 flash banks at 0x08000000 and 0x08100000"
}
unset h743_banks
